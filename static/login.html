<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Jankalyan Blood Bank Digital Form System</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at top right, #1E3A8A 0%, #0F172A 80%);
      padding: 16px;
    }
    .login-card {
      background: white;
      padding: 36px 32px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 440px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-logo {
      font-size: 3.2rem;
      margin-bottom: 8px;
      display: inline-block;
      filter: drop-shadow(0 4px 6px rgba(225, 29, 72, 0.3));
    }
    .login-title {
      font-size: 1.5rem;
      color: var(--primary);
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .login-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(30, 58, 138, 0.3);
      transition: all 0.2s ease;
      min-height: 48px;
    }
    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(30, 58, 138, 0.4);
    }
    .btn-login:active {
      transform: translateY(0);
    }
    .demo-credentials {
      margin-top: 22px;
      padding: 14px;
      background: #F8FAFC;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      color: #475569;
      border: 1px dashed #CBD5E1;
      line-height: 1.6;
    }
    .login-footer {
      margin-top: 28px;
      color: rgba(255,255,255,0.85);
      font-size: 0.88rem;
      text-align: center;
    }
    @media (max-width: 480px) {
      .login-card {
        padding: 24px 20px;
      }
      .login-title {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">🩸</div>
      <h1 class="login-title" data-i18n="system_title">Jankalyan Blood Centre</h1>
      <p class="login-subtitle" data-i18n="system_subtitle">Blood Bank Digital Form System (QF/JKRP/18)</p>
    </div>

    <div style="display:flex; justify-content:center; margin-bottom: 18px;">
      <div class="lang-switch-box" style="background:#E2E8F0;">
        <button id="btnLangEn" class="lang-btn active" onclick="setLanguage('en')" style="color:#0F172A;">English</button>
        <button id="btnLangMr" class="lang-btn" onclick="setLanguage('mr')" style="color:#0F172A;">मराठी</button>
      </div>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">Username / वापरकर्ता नाव</label>
        <input type="text" id="username" class="form-control" required placeholder="Enter username (e.g. admin, staff, doctor)">
      </div>

      <div class="form-group">
        <label for="password">Password / पासवर्ड</label>
        <input type="password" id="password" class="form-control" required placeholder="Enter password">
      </div>

      <button type="submit" class="btn-login">Login / साइन इन करा 🔓</button>
    </form>

    <div class="demo-credentials">
      <strong>🔑 Default Hospital Roles & Accounts:</strong><br>
      • Admin: <code>admin</code> / <code>Admin@123</code><br>
      • Staff: <code>staff</code> / <code>Staff@123</code><br>
      • Medical Officer: <code>doctor</code> / <code>Doctor@123</code>
    </div>
  </div>

  <footer class="login-footer">
    <div>Copyright ©2026 <span class="highlight-text">Jankalyan Blood centre</span> All rights reserved.</div>
    <div style="margin-top: 4px;">Powered by <span class="highlight-text">Harbinger Group</span></div>
  </footer>

  <script src="/js/language.js"></script>
  <script src="/js/common.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          showToast('Login successful!', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 500);
        } else {
          showToast(data.message, 'error');
        }
      } catch (err) {
        showToast('Login failed. Server error.', 'error');
      }
    }
  </script>
</body>
</html>
