<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Jankalyan Blood Bank Digital Form System</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1E3A8A 0%, #0F172A 100%);
      padding: 20px;
    }
    .login-card {
      background: white;
      padding: 36px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 440px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-logo {
      font-size: 3rem;
      margin-bottom: 8px;
    }
    .login-title {
      font-size: 1.4rem;
      color: #1E3A8A;
      font-weight: 700;
    }
    .login-subtitle {
      font-size: 0.85rem;
      color: #64748B;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-control {
      width: 100%;
      padding: 12px;
      border: 1px solid #CBD5E1;
      border-radius: 6px;
      font-size: 1rem;
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: #1E3A8A;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-login:hover {
      background: #1D4ED8;
    }
    .demo-credentials {
      margin-top: 20px;
      padding: 12px;
      background: #F8FAFC;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #475569;
      border: 1px dashed #CBD5E1;
    }
    .login-footer {
      margin-top: 24px;
      color: rgba(255,255,255,0.85);
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">🩸</div>
      <h1 class="login-title" data-i18n="system_title">Jankalyan Blood Centre</h1>
      <p class="login-subtitle" data-i18n="system_subtitle">Blood Bank Digital Form System (QF/JKRP/18)</p>
    </div>

    <div style="display:flex; justify-content:center; margin-bottom: 18px;">
      <div class="lang-switch-box" style="background:#E2E8F0;">
        <button id="btnLangEn" class="lang-btn active" onclick="setLanguage('en')" style="color:#0F172A;">English</button>
        <button id="btnLangMr" class="lang-btn" onclick="setLanguage('mr')" style="color:#0F172A;">मराठी</button>
      </div>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">Username / वापरकर्ता नाव</label>
        <input type="text" id="username" class="form-control" required placeholder="Enter username (e.g. admin, staff, doctor)">
      </div>

      <div class="form-group">
        <label for="password">Password / पासवर्ड</label>
        <input type="password" id="password" class="form-control" required placeholder="Enter password">
      </div>

      <button type="submit" class="btn-login">Login / साइन इन करा 🔓</button>
    </form>

    <div class="demo-credentials">
      <strong>🔑 Default Hospital Roles & Accounts:</strong><br>
      • Admin: <code>admin</code> / <code>Admin@123</code><br>
      • Staff: <code>staff</code> / <code>Staff@123</code><br>
      • Medical Officer: <code>doctor</code> / <code>Doctor@123</code>
    </div>
  </div>

  <footer class="login-footer">
    <p>⚡ Powered by <strong style="color:#FFFFFF; font-weight:700;">Harbinger Group</strong> 🏢 | Jankalyan Blood Bank Digital System</p>
  </footer>

  <script src="/js/language.js"></script>
  <script src="/js/common.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          showToast('Login successful!', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 500);
        } else {
          showToast(data.message, 'error');
        }
      } catch (err) {
        showToast('Login failed. Server error.', 'error');
      }
    }
  </script>
</body>
</html>
